name: Sincronizar com a calculadora da Receita Federal
on:
  schedule:
    - cron: '17 9 * * *'   # todo dia às 06h17 de Brasília
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sincronizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Baixar o repositório oficial
        run: git clone --depth 1 https://github.com/ReceitaFederal/calculadora-rtc-regime-regular.git oficial
      - name: Reconstruir a base e exportar a tabela
        run: python3 sincronizar.py oficial novo.json
      - name: Conferir contra os casos de teste oficiais
        id: conferir
        run: node conferir.js oficial novo.json dados
        continue-on-error: true
      - name: Publicar
        run: |
          git config user.name "sincronizacao" && git config user.email "sincronizacao@users.noreply.github.com"
          git add dados && (git diff --cached --quiet || git commit -m "Sincronização de $(date -u +%Y-%m-%d)") && git push
      - name: Avisar quando a tabela nova for reprovada
        if: steps.conferir.outcome == 'failure'
        run: exit 1
